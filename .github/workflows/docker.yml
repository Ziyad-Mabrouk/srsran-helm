name: Docker Builder

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Select which images to build"
        required: true
        default: "all"

env:
  GHCR_USER: ziyad-mabrouk
  TAG: release_26_04

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - NAME: srsran-gnb-zmq
            DOCKERFILE: ./docker/Dockerfile.srsran.gnb.zmq
            CONTEXT: ./docker
            KEY: srsran-gnb-zmq
          - NAME: srsran-gnb-dpdk
            DOCKERFILE: ./docker/Dockerfile.srsran.gnb.dpdk
            CONTEXT: ./docker
            KEY: srsran-gnb-dpdk
          - NAME: srsran-gnb-uhd
            DOCKERFILE: ./docker/Dockerfile.srsran.gnb.uhd
            CONTEXT: ./docker
            KEY: srsran-gnb-uhd
          - NAME: ocudu-gnb-zmq
            DOCKERFILE: ./docker/Dockerfile.ocudu.gnb.zmq
            CONTEXT: ./docker
            KEY: ocudu-gnb-zmq
          - NAME: ocudu-gnb-dpdk
            DOCKERFILE: ./docker/Dockerfile.ocudu.gnb.dpdk
            CONTEXT: ./docker
            KEY: ocudu-gnb-dpdk
          - NAME: ocudu-gnb-uhd
            DOCKERFILE: ./docker/Dockerfile.ocudu.gnb.uhd
            CONTEXT: ./docker
            KEY: ocudu-gnb-uhd
          - NAME: ocudu-du-zmq
            DOCKERFILE: ./docker/Dockerfile.ocudu.du.zmq
            CONTEXT: ./docker
            KEY: ocudu-du-zmq
          - NAME: ocudu-du-dpdk
            DOCKERFILE: ./docker/Dockerfile.ocudu.du.dpdk
            CONTEXT: ./docker
            KEY: ocudu-du-dpdk
          - NAME: ocudu-du-uhd
            DOCKERFILE: ./docker/Dockerfile.ocudu.du.uhd
            CONTEXT: ./docker
            KEY: ocudu-du-uhd
          - NAME: ocudu-cu
            DOCKERFILE: ./docker/Dockerfile.ocudu.cu
            CONTEXT: ./docker
            KEY: ocudu-cu
          - NAME: ocudu-cu-cp
            DOCKERFILE: ./docker/Dockerfile.ocudu.cu-cp
            CONTEXT: ./docker
            KEY: ocudu-cu-cp
          - NAME: ocudu-cu-up
            DOCKERFILE: ./docker/Dockerfile.ocudu.cu-up
            CONTEXT: ./docker
            KEY: ocudu-cu-up
          - NAME: srsue
            DOCKERFILE: ./docker/Dockerfile.srsUE
            CONTEXT: ./docker
            KEY: srsue
          - NAME: telegraf
            DOCKERFILE: ./docker/Dockerfile.telegraf
            CONTEXT: ./docker
            KEY: telegraf

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine if this image should build
        id: filter
        run: |
          INPUT="${{ github.event.inputs.images }}"
          KEY="${{ matrix.KEY }}"
          if [[ "$INPUT" == "all" ]] || [[ "$INPUT" == *"$KEY"* ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.filter.outputs.build == 'true'
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ env.GHCR_USER }}" --password-stdin

      - name: Build ${{ matrix.NAME }}
        if: steps.filter.outputs.build == 'true'
        run: |
          docker build \
            -t ghcr.io/${{ env.GHCR_USER }}/${{ matrix.NAME }}:${{ env.TAG }} \
            -f ${{ matrix.DOCKERFILE }} \
            ${{ matrix.CONTEXT }}

      - name: Push ${{ matrix.NAME }}
        if: steps.filter.outputs.build == 'true'
        run: docker push ghcr.io/${{ env.GHCR_USER }}/${{ matrix.NAME }}:${{ env.TAG }}

      - name: Skip build
        if: steps.filter.outputs.build == 'false'
        run: echo "Skipping ${{ matrix.NAME }} (not selected)."

      - name: Log out
        if: always()
        run: docker logout ghcr.io
